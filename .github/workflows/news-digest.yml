name: News digest

on:
  schedule:
    - cron: "0 * * * *" # every hour
  workflow_dispatch: {} # lets you trigger it manually from the Actions tab

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed for the self-commit step below
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - run: pip install -r requirements.txt

      # plastemart_news.py only needs to run every 6h, not every hour like
      # this workflow — gated here (rather than a separate workflow file)
      # so both scrapers stay in one place and polymer news is always fresh
      # before gemini_news.py reads it below.
      - id: check_polymer
        run: |
          hour=$(date -u +%H)
          if [ $((10#$hour % 6)) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Scrape polymer price news (every 6h)
        if: steps.check_polymer.outputs.run == 'true'
        run: python plastemart_news.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - run: python gemini_news.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Repo Variable, not Secret — it's just config, not sensitive.
          # Falls back to the script's default if unset.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      # GitHub auto-disables a scheduled workflow after 60 days with zero
      # repo activity. This is the only commit this repo ever gets, so
      # without it the schedule would eventually go quiet on its own.
      - name: Record run (keeps the schedule alive)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > last_run.txt
          git config user.email "actions@github.com"
          git config user.name "news-digest-bot"
          git add last_run.txt
          git diff --cached --quiet || git commit -m "chore: record run $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push
